<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geanta | Zalmoxis Leather</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3e7db; color: #2a1c16; transition: background 0.3s, color 0.3s; }
        .btn-main, .channel-link, .hamburger, .theme-toggle-inline, .zalmoxis-links-container a { -webkit-tap-highlight-color: transparent; cursor: pointer; }
        
        /* [Stilurile tale rămân identice] */
        html.dark-mode body { background: #121212; color: #e0e0e0; }
        .container { max-width: 1100px; margin: 0 auto; margin-top: 100px !important; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px 20px; align-items: center; }
        .image-box img { width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: 0.3s; }
        h1 { font-size: 34px; margin: 0; }
        .price { font-size: 22px; font-weight: 600; margin: 10px 0; }
        .desc { color: #5a3a2e; line-height: 1.5; }
        .main-header { background: #f3e7db; position: fixed; top: 0; left: 0; width: 100%; z-index: 10000; border-bottom: 1px solid rgba(42, 28, 22, 0.08); }
        .header-container { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: 700; text-decoration: none; color: #2a1c16; letter-spacing: 3px; z-index: 10003; }
        .hamburger { display: block; cursor: pointer; background: transparent; border: none; padding: 6px; z-index: 10003; position: relative; }
        .bar { display: block; width: 24px; height: 1.5px; margin: 5px auto; background-color: #2a1c16; transition: all 0.3s; }
        .hamburger.active .bar:nth-child(2) { opacity: 0; }
        .hamburger.active .bar:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
        .hamburger.active .bar:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
        
        /* FIX MENIU: Am eliminat display: none !important care bloca totul */
        .zalmoxis-menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: #f3e7db; z-index: 10001; visibility: hidden; opacity: 0; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .zalmoxis-menu-overlay.active { visibility: visible; opacity: 1; }
        
        .zalmoxis-links-container { display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .zalmoxis-links-container a { text-decoration: none; color: #2a1c16; font-size: 26px; }
        .zalmoxis-popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0, 0, 0, 0.5); z-index: 20000; display: none; align-items: center; justify-content: center; }
        .zalmoxis-popup-overlay.active { display: flex; }
        .zalmoxis-popup-content { background: #f3e7db; padding: 35px; border-radius: 16px; width: 90%; max-width: 400px; position: relative; }
        .btn-main { padding: 14px 20px; border: 1px solid #9A6A3A; background: transparent; cursor: pointer; }
        .btn-buy { background: #9A6A3A; color: white; }
        @media(max-width:768px){ .container { grid-template-columns: 1fr; margin-top: 70px !important; } }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <a href="../index.html" class="logo">ZALMOXIS</a>
        <button class="hamburger" id="hamb" aria-label="Meniu">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>
    </div>
</header>

<div class="zalmoxis-menu-overlay" id="menu">
    <nav class="zalmoxis-links-container">
        <a href="../index.html">Acasă</a>
        <a href="../index.html#produse">Produse</a>
    </nav>
</div>

<div class="container">
    <div class="image-box"><img src="../image/geanta1.jpg" alt="Geanta"></div>
    <div>
        <h1>Geanta</h1>
        <div class="action-buttons-group">
            <button class="btn-main btn-buy" id="btnOrder">Comandă Rapidă</button>
            <button class="btn-main" id="btnChat">Discută pe Chat</button>
        </div>
    </div>
</div>

<div id="orderPopup" class="zalmoxis-popup-overlay"><div class="zalmoxis-popup-content"><button id="closeOrder">&times;</button><h3>Comandă</h3></div></div>
<div id="socialPopup" class="zalmoxis-popup-overlay"><div class="zalmoxis-popup-content"><button id="closeChat">&times;</button></div></div>

<script>
    // FIXUL CRITIC: Folosim un singur eveniment de click pentru a evita conflictele
    const hamb = document.getElementById("hamb");
    const menu = document.getElementById("menu");

    hamb.onclick = () => {
        hamb.classList.toggle("active");
        menu.classList.toggle("active");
    };

    // Logica pop-up
    document.getElementById("btnOrder").onclick = () => document.getElementById("orderPopup").classList.add("active");
    document.getElementById("closeOrder").onclick = () => document.getElementById("orderPopup").classList.remove("active");
    
    document.getElementById("btnChat").onclick = () => document.getElementById("socialPopup").classList.add("active");
    document.getElementById("closeChat").onclick = () => document.getElementById("socialPopup").classList.remove("active");
</script>
</body>
</html>
