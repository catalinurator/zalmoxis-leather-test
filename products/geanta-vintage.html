<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geanta | Zalmoxis Leather</title>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'enabled' || (savedTheme === null && prefersDark)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="../style.css">

    <style>
        /* Stiluri specifice doar pentru pagina de produs */
        .product-container {
            max-width: 1100px;
            margin: 120px auto 40px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 20px;
            align-items: start;
        }

        .main-slider { width: 100%; border-radius: 16px; overflow: hidden; margin-bottom: 10px; }
        .main-slider img { width: 100%; height: 400px; object-fit: cover; display: block; }
        
        .thumbs { height: 80px; margin-top: 10px; }
        .thumbs .swiper-slide { width: 25%; height: 100%; opacity: 0.5; cursor: pointer; }
        .thumbs .swiper-slide img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .thumbs .swiper-slide-thumb-active { opacity: 1; border: 2px solid var(--color-accent); }

        .product-info h1 { font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 15px; }
        .price { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; color: var(--color-accent); }
        .desc { line-height: 1.6; margin-bottom: 30px; color: var(--color-grey); }

        @media(max-width:768px){
            .product-container { grid-template-columns: 1fr; margin-top: 80px; }
        }
    </style>
</head>
<body>

<!-- Header, Meniu și Popup-uri rămân neschimbate (folosesc clasele din style.css) -->
<!-- ... restul codului tău (Header, Overlay, Popup-uri) rămâne la fel ... -->

<div class="product-container">
    <div class="image-box">
        <div class="swiper main-slider">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="../image/geanta1.jpg" alt="Geanta"></div>
                <div class="swiper-wrapper"><div class="swiper-slide"><img src="../image/geanta2.jpg" alt="Geanta"></div></div>
            </div>
        </div>
        <div class="swiper thumbs">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="../image/geanta1.jpg"></div>
                <div class="swiper-slide"><img src="../image/geanta2.jpg"></div>
            </div>
        </div>
    </div>

    <div class="product-info">
        <h1>Geanta</h1>
        <div class="price">TEST 2</div>
        <div class="desc">Geanta din piele naturală, lucrată manual pentru rezistență.</div>
        <div class="action-buttons-group">
            <button class="btn btn-dark" id="openOrderPopup">Comandă Rapidă</button>
            <button class="btn" id="openChatPopup">Discută pe Chat</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    var thumbs = new Swiper(".thumbs", { spaceBetween: 10, slidesPerView: 4, freeMode: true, watchSlidesProgress: true });
    var main = new Swiper(".main-slider", { spaceBetween: 10, thumbs: { swiper: thumbs } });
</script>
</body>
</html>
