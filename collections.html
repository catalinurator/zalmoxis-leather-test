<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colecții - Zalmoxis Leather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- Comutator limbă RO / EN (stil propriu, ca să funcționeze indiferent de restul CSS-ului paginii) --- */
        .lang-seg-row { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
        .lang-seg-row-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: 0.6; }
        .lang-seg { display: inline-flex; border: 1px solid rgba(140, 98, 57, 0.4); border-radius: 20px; padding: 3px; gap: 3px; }
        .lang-seg-btn { border: none; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: .03em; color: inherit; padding: 6px 15px; border-radius: 16px; cursor: pointer; transition: background 0.2s ease, color 0.2s ease; }
        .lang-seg-btn.is-active { background: #8c6239; color: #fff; }
    </style>
</head>
<body>
    <!-- TOP BAR -->
    <div class="topbar">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <div class="logo">ZALMOXIS</div>
        
        <!-- Buton Dark Mode Modern -->
        <div id="theme-toggle" class="theme-toggle">
            <span class="sun">☀️</span>
            <span class="moon">☽</span>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <h2>ZALMOXIS</h2>
        <a href="index.html" onclick="toggleMenu()" data-i18n="nav_home">Acasă</a>
        <a href="collections.html" onclick="toggleMenu()" data-i18n="nav_collections">Colecții</a>
        <a href="index.html#produse" onclick="toggleMenu()" data-i18n="nav_products">Produse</a>
        <a href="index.html#atelier" onclick="toggleMenu()" data-i18n="nav_atelier">Atelier</a>
        <a href="index.html#contact" onclick="toggleMenu()" data-i18n="nav_contact">Contact</a>

        <div class="lang-seg-row">
            <span class="lang-seg-row-label">Limbă / Language</span>
        </div>
        <div class="lang-seg" id="langSeg" role="group" aria-label="Alege limba">
            <button type="button" class="lang-seg-btn" data-lang="ro">RO</button>
            <button type="button" class="lang-seg-btn" data-lang="en">EN</button>
        </div>
    </div>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- HERO COLECȚII -->
    <section class="hero fade-in" style="height: 55vh; min-height: 420px;">
        <div class="hero-content">
            <h1 data-i18n="hero_title">Colecțiile Zalmoxis</h1>
            <p data-i18n="hero_subtitle">Piele naturală • Lucrată manual • Calitate premium</p>
        </div>
    </section>

    <!-- GRID COLECȚII -->
    <section class="fade-in" style="padding: 60px 20px;">
        <h2 style="text-align: center; margin-bottom: 50px; font-size: 42px;" data-i18n="section_title">Toate Colecțiile</h2>
        
        <div class="grid">
            <!-- PORTOFELE -->
            <a class="card" href="index.html#produse">
                <img src="image/portmoneu1.jpg" alt="Portofele">
                <div class="info">
                    <h3 data-i18n="card_wallets_title">Portofele</h3>
                    <p data-i18n="card_wallets_desc">Minimaliste & elegante</p>
                </div>
            </a>

            <!-- CURELE -->
            <a class="card" href="products/curea-classic.html">
                <img src="image/curea1.png" alt="Curele">
                <div class="info">
                    <h3 data-i18n="card_belts_title">Curele</h3>
                    <p data-i18n="card_belts_desc">Handmade din piele naturală</p>
                </div>
            </a>

            <!-- GENȚI -->
            <a class="card" href="products/geanta-vintage.html">
                <img src="image/geanta1.jpg" alt="Genți">
                <div class="info">
                    <h3 data-i18n="card_bags_title">Genți</h3>
                    <p data-i18n="card_bags_desc">Design vintage premium</p>
                </div>
            </a>
        </div>
    </section>

    <script>
        // Toggle Sidebar
        function toggleMenu() {
            document.getElementById("sidebar").classList.toggle("open");
            document.getElementById("overlay").classList.toggle("active");
        }

        // Dark Mode Modern
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        function setTheme(isDark) {
            if (isDark) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            localStorage.setItem('darkMode', isDark);
        }

        // Click handler
        themeToggle.addEventListener('click', () => {
            const isDark = !html.classList.contains('dark');
            setTheme(isDark);
        });

        // Scroll Reveal + Theme Load
        function reveal() {
            document.querySelectorAll(".fade-in").forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight - 80) {
                    el.classList.add("show");
                }
            });
        }

        window.addEventListener("scroll", reveal);
        window.addEventListener("load", () => {
            reveal();
            const saved = localStorage.getItem('darkMode');
            if (saved !== null) {
                setTheme(saved === 'true');
            } else {
                setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
            }
        });
    </script>

    <script>
    // --- Sistem de limbă RO / EN, cu memorie (localStorage) comună pe tot site-ul ---
    (function () {
        const translations = {
            ro: {
                nav_home: "Acasă", nav_collections: "Colecții", nav_products: "Produse",
                nav_atelier: "Atelier", nav_contact: "Contact",
                hero_title: "Colecțiile Zalmoxis",
                hero_subtitle: "Piele naturală • Lucrată manual • Calitate premium",
                section_title: "Toate Colecțiile",
                card_wallets_title: "Portofele", card_wallets_desc: "Minimaliste & elegante",
                card_belts_title: "Curele", card_belts_desc: "Handmade din piele naturală",
                card_bags_title: "Genți", card_bags_desc: "Design vintage premium"
            },
            en: {
                nav_home: "Home", nav_collections: "Collections", nav_products: "Products",
                nav_atelier: "Workshop", nav_contact: "Contact",
                hero_title: "The Zalmoxis Collections",
                hero_subtitle: "Natural leather • Handmade • Premium quality",
                section_title: "All Collections",
                card_wallets_title: "Wallets", card_wallets_desc: "Minimalist & elegant",
                card_belts_title: "Belts", card_belts_desc: "Handmade from natural leather",
                card_bags_title: "Bags", card_bags_desc: "Premium vintage design"
            }
        };

        function applyLanguage(lang) {
            document.documentElement.setAttribute("lang", lang);
            const t = translations[lang];
            document.querySelectorAll("[data-i18n]").forEach((el) => {
                const key = el.getAttribute("data-i18n");
                if (t[key] !== undefined) el.textContent = t[key];
            });
            document.querySelectorAll(".lang-seg-btn").forEach((b) => {
                b.classList.toggle("is-active", b.dataset.lang === lang);
            });
            localStorage.setItem("zalmoxisLang", lang);
        }

        let currentLang = localStorage.getItem("zalmoxisLang") || "ro";
        applyLanguage(currentLang);

        document.querySelectorAll(".lang-seg-btn").forEach((b) => {
            b.addEventListener("click", () => {
                currentLang = b.dataset.lang;
                applyLanguage(currentLang);
            });
        });
    })();
    </script>
</body>
</html>
