<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geanta | Zalmoxis Leather</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* CSS REVIZUIT PENTRU GALERIE */
        .product-gallery { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .main-image-container { width: 100%; overflow: hidden; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .main-image-container img { width: 100%; display: block; cursor: zoom-in; }
        
        .thumbnails { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .thumbnails::-webkit-scrollbar { display: none; }
        .thumbnails img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .thumbnails img.active { border-color: #9A6A3A; }

        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 99999; cursor: zoom-out; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }

        /* Restul CSS-ului tău (păstrat) */
        body { margin: 0; font-family: -apple-system, sans-serif; background: #f3e7db; color: #2a1c16; }
        .container { max-width: 1100px; margin: 100px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px 20px; }
        @media(max-width:768px){ .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header class="main-header">...</header>

<div class="container">
    <div class="product-gallery">
        <div class="main-image-container">
            <img id="mainDisplay" src="../image/geanta1.jpg" alt="Geantă principală" class="zoomable">
        </div>
        <div class="thumbnails">
            <img src="../image/geanta1.jpg" class="active" onclick="changeImage(this)">
            <img src="../image/geanta2.jpg" onclick="changeImage(this)">
            <img src="../image/geanta3.jpg" onclick="changeImage(this)">
        </div>
    </div>

    <div>
        <h1>Geanta</h1>
        <button id="openOrderPopup" class="btn-main">Comandă Rapidă</button>
    </div>
</div>

<div id="lightbox" class="lightbox"><img id="lightboxImg" src=""></div>

<script>
    // Logică Galerie
    function changeImage(element) {
        document.getElementById('mainDisplay').src = element.src;
        document.querySelectorAll('.thumbnails img').forEach(img => img.classList.remove('active'));
        element.classList.add('active');
    }

    // Zoom
    const lightbox = document.getElementById('lightbox');
    document.getElementById('mainDisplay').addEventListener('click', () => {
        document.getElementById('lightboxImg').src = document.getElementById('mainDisplay').src;
        lightbox.classList.add('active');
    });
    lightbox.addEventListener('click', () => lightbox.classList.remove('active'));

    // Păstrează restul logicii tale (Hamburger, Popup-uri, etc.) aici
</script>
</body>
</html>
