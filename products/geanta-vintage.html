<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geanta | Zalmoxis Leather</title>

    <script>
        // Funcție imediată pentru a preveni "flicker-ul" de temă
        (function() {
            const savedTheme = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'enabled' || (savedTheme === null && prefersDark)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>

    <link rel="stylesheet" href="../style.css">

    <style>
        /* CSS-ul rămâne optimizat, dar cu structură lizibilă */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3e7db; color: #2a1c16; transition: background 0.3s, color 0.3s; }
        html.dark-mode body { background: #121212; color: #e0e0e0; }
        
        /* Header și Navigație */
        .main-header { background: #f3e7db; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(42, 28, 22, 0.08); transition: 0.3s; }
        html.dark-mode .main-header { background: #121212; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        
        .header-container { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .logo { font-size: 18px; font-weight: 700; text-decoration: none; color: #2a1c16; letter-spacing: 3px; z-index: 10003; }
        html.dark-mode .logo { color: #e0e0e0; }

        /* Meniu Hamburger */
        .hamburger { background: transparent; border: none; padding: 6px; z-index: 10003; cursor: pointer; }
        .bar { display: block; width: 24px; height: 1.5px; margin: 5px auto; background-color: #2a1c16; transition: 0.3s; }
        html.dark-mode .bar { background-color: #e0e0e0; }
        
        .hamburger.active .bar:nth-child(2) { opacity: 0; }
        .hamburger.active .bar:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
        .hamburger.active .bar:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

        /* Overlay Meniu */
        .zalmoxis-menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #f3e7db; z-index: 10001; display: none; opacity: 0; transition: 0.3s; flex-direction: column; align-items: center; justify-content: center; }
        html.dark-mode .zalmoxis-menu-overlay { background: #121212; }
        .zalmoxis-menu-overlay.active { display: flex !important; opacity: 1; }
        
        .zalmoxis-links-container { display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .zalmoxis-links-container a { text-decoration: none; color: #2a1c16; font-size: 26px; font-weight: 500; }
        html.dark-mode .zalmoxis-links-container a { color: #e0e0e0; }

        /* Restul stilurilor... */
        .container { max-width: 1100px; margin: 100px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px 20px; }
        .btn-main { padding: 14px 20px; border: 1px solid #9A6A3A; background: transparent; color: #2A211B; font-weight: 600; cursor: pointer; }
        html.dark-mode .btn-main { color: #e0e0e0; border-color: #c49a6c; }

        @media(max-width:768px){ .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <a href="../index.html" class="logo">ZALMOXIS</a>
        <button class="hamburger" id="hamburgerBtn" aria-label="Deschide meniul">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>
    </div>
</header>

<!-- Am adăugat ID pentru a putea targeta zona de click -->
<div class="zalmoxis-menu-overlay" id="menuOverlay">
    <nav class="zalmoxis-links-container">
        <a href="../index.html">Acasă</a>
        <a href="../index.html#produse">Produse</a>
        <a href="../index.html#contact">Contact</a>
        <button id="themeToggleBtn" style="background:none; border:1px solid #9A6A3A; border-radius:20px; padding:10px 20px; cursor:pointer;">
            Schimbă Tema
        </button>
    </nav>
</div>

<main class="container">
    <!-- Conținutul produsului tău -->
    <div class="image-box"><img src="../image/geanta1.jpg" alt="Geanta"></div>
    <div>
        <h1>Geanta</h1>
        <div class="action-buttons-group">
            <button class="btn-main" id="openOrderPopup">Comandă</button>
        </div>
    </div>
</main>

<script>
    // 1. Logică Hamburger și închidere la click în afara link-urilor
    const hamburger = document.getElementById("hamburgerBtn");
    const navOverlay = document.getElementById("menuOverlay");

    const toggleMenu = () => {
        navOverlay.classList.toggle("active");
        hamburger.classList.toggle("active");
    };

    hamburger.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMenu();
    });

    // Închide meniul dacă se dă click oriunde în interiorul overlay-ului, 
    // dar nu pe butoanele din interior (link-uri)
    navOverlay.addEventListener("click", (e) => {
        if (e.target === navOverlay) {
            toggleMenu();
        }
    });

    // 2. Logică Dark Mode Automată
    const themeBtn = document.getElementById('themeToggleBtn');
    
    // Detectează schimbările la nivel de sistem (telefon)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        const newTheme = e.matches ? 'enabled' : 'disabled';
        document.documentElement.classList.toggle('dark-mode', e.matches);
        localStorage.setItem('darkMode', newTheme);
    });

    // Toggle manual
    themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
    });
</script>
</body>
</html>
