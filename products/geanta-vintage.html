<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geanta | Zalmoxis Leather</title>
    
    <!-- Librării pentru Galerie și Zoom -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'enabled' || (savedTheme === null && prefersDark)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>

    <link rel="stylesheet" href="../style.css">

    <style>
        /* Stiluri noi pentru galerie */
        .swiper { width: 100%; border-radius: 16px; margin-bottom: 10px; }
        .swiper-slide img { width: 100%; display: block; border-radius: 16px; cursor: pointer; }
        .thumbs { height: 80px; box-sizing: border-box; }
        .thumbs .swiper-slide { width: 25%; height: 100%; opacity: 0.4; cursor: pointer; border-radius: 8px; overflow: hidden; }
        .thumbs .swiper-slide-thumb-active { opacity: 1; border: 2px solid #9A6A3A; }

        /* Stilurile tale originale păstrate complet */
        .hamburger, .zalmoxis-links-container a, .btn-main, .close-popup-btn { touch-action: manipulation; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3e7db; color: #2a1c16; transition: background 0.3s, color 0.3s; }
        .btn-main, .channel-link, .hamburger, .theme-toggle-inline, .zalmoxis-links-container a { -webkit-tap-highlight-color: transparent; cursor: pointer; }
        html.dark-mode body { background: #121212; color: #e0e0e0; }
        html.dark-mode .price { color: #c49a6c; }
        html.dark-mode .desc { color: #b0a095; }
        html.dark-mode .btn { border-color: #c49a6c; color: #e0e0e0; }
        html.dark-mode .btn:hover { background: #c49a6c; color: #121212; }
        .container { max-width: 1100px; margin: 0 auto; margin-top: 100px !important; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px 20px; align-items: start; }
        h1 { font-size: 34px; margin: 0; }
        .price { font-size: 22px; font-weight: 600; margin: 10px 0; }
        .desc { color: #5a3a2e; line-height: 1.5; }
        .main-header { background: #f3e7db; position: fixed; top: 0; left: 0; width: 100%; z-index: 10000; border-bottom: 1px solid rgba(42, 28, 22, 0.08); transition: background 0.3s, border-color 0.3s; }
        html.dark-mode .main-header { background: #121212; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .header-container { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: 700; text-decoration: none; color: #2a1c16; letter-spacing: 3px; z-index: 10003; }
        html.dark-mode .logo { color: #e0e0e0; }
        .hamburger { display: block; background: transparent; border: none; padding: 6px; z-index: 10003 !important; position: relative; }
        .bar { display: block; width: 24px; height: 1.5px; margin: 5px auto; transition: all 0.3s ease-in-out; background-color: #2a1c16; }
        html.dark-mode .bar { background-color: #e0e0e0; }
        .hamburger.active .bar:nth-child(2) { opacity: 0; }
        .hamburger.active .bar:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
        .hamburger.active .bar:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
        .zalmoxis-menu-overlay { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100vh !important; background-color: #f3e7db !important; z-index: 10001 !important; display: none !important; opacity: 0 !important; transform: translateY(-20px) !important; transition: opacity 0.3s ease, transform 0.3s ease !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; }
        html.dark-mode .zalmoxis-menu-overlay { background-color: #121212 !important; }
        .zalmoxis-menu-overlay.active { display: flex !important; opacity: 1 !important; transform: translateY(0) !important; }
        .zalmoxis-links-container { display: flex !important; flex-direction: column !important; align-items: center !important; gap: 30px !important; width: 100% !important; }
        .zalmoxis-links-container a { text-decoration: none !important; color: #2a1c16 !important; font-size: 26px !important; font-weight: 500 !important; transition: color 0.3s !important; }
        html.dark-mode .zalmoxis-links-container a { color: #e0e0e0 !important; }
        .theme-toggle-inline { background: transparent !important; border: 1px solid rgba(154, 106, 58, 0.4) !important; padding: 12px 24px !important; border-radius: 25px !important; color: #5a3a2e !important; cursor: pointer !important; display: flex !important; align-items: center !important; gap: 10px !important; }
        .action-buttons-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .btn-main { display: inline-block; padding: 14px 20px; border: 1px solid #9A6A3A; background: transparent; color: #2A211B; text-decoration: none; font-size: 15px; font-weight: 600; text-align: center; cursor: pointer; transition: .3s ease; z-index: 10; }
        .btn-buy { background: #9A6A3A; color: white; }
        .zalmoxis-popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0, 0, 0, 0.5); z-index: 20000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .zalmoxis-popup-overlay.active { display: flex; opacity: 1; }
        .zalmoxis-popup-content { background: #f3e7db; padding: 35px 25px; border-radius: 16px; max-width: 420px; width: 90%; text-align: center; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-popup-btn { position: absolute; top: 15px; right: 15px; background: transparent; border: none; font-size: 28px; cursor: pointer; }
        .form-input { width: 100%; padding: 11px; border: 1px solid rgba(154, 106, 58, 0.5); border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; background: #9A6A3A; color: white; border: none; padding: 14px; cursor: pointer; border-radius: 6px; margin-top: 10px; }
        .social-channels-grid { display: flex; flex-direction: column; gap: 12px; }
        .channel-link { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; text-decoration: none; color: white !important; font-weight: 600; border-radius: 8px; }
        @media(max-width:768px){ .container { grid-template-columns: 1fr; margin-top: 70px !important; } }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <a href="../index.html" class="logo">ZALMOXIS</a>
        <button class="hamburger" aria-label="Deschide meniul">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>
    </div>
</header>

<div class="zalmoxis-menu-overlay">
    <nav class="zalmoxis-links-container">
        <a href="../index.html">Acasă</a>
        <a href="../index.html#produse">Produse</a>
        <a href="../index.html#despre">Despre Noi</a>
        <a href="../index.html#contact">Contact</a>
        <button id="themeToggleBtn" class="theme-toggle-inline">Schimbă Tema</button>
    </nav>
</div>

<div class="container">
    <!-- GALERIE -->
    <div class="image-box">
        <div class="swiper main-slider">
            <div class="swiper-wrapper">
                <!-- AICI PUI IMAGINILE TALE (Adaugă mai multe slide-uri dacă vrei) -->
                <div class="swiper-slide"><img src="../image/geanta1.jpg" alt="Produs"></div>
                <div class="swiper-slide"><img src="../image/geanta1.jpg" alt="Produs"></div>
            </div>
        </div>
        <div class="swiper thumbs">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="../image/geanta1.jpg"></div>
                <div class="swiper-slide"><img src="../image/geanta1.jpg"></div>
            </div>
        </div>
    </div>

    <div>
        <h1>Geanta</h1>
        <div class="price">TEST 2</div>
        <div class="desc">Geanta din piele naturală, lucrată manual pentru rezistență.</div>
        <div class="action-buttons-group">
            <button class="btn-main btn-buy" id="openOrderPopup">Comandă Rapidă</button>
            <button class="btn-main btn-chat" id="openChatPopup">Discută pe Chat</button>
        </div>
    </div>
</div>

<!-- Popup-uri -->
<div id="orderPopup" class="zalmoxis-popup-overlay">
    <div class="zalmoxis-popup-content">
        <button class="close-popup-btn" id="closeOrderPopup">&times;</button>
        <h3>Comandă Rapidă</h3>
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="bd32b38b-4a9d-431e-97cd-dc32eb24b2a4">
            <div class="form-group"><label>Nume:</label><input type="text" name="Nume" class="form-input" required></div>
            <div class="form-group"><label>Telefon:</label><input type="tel" name="Telefon" class="form-input" required></div>
            <button type="submit" class="btn-submit">Trimite</button>
        </form>
    </div>
</div>

<div id="socialPopup" class="zalmoxis-popup-overlay">
    <div class="zalmoxis-popup-content">
        <button class="close-popup-btn" id="closeChatPopup">&times;</button>
        <h3>Contact</h3>
        <div class="social-channels-grid">
            <a href="https://wa.me/37369639506" class="channel-link" style="background: #25D366;">WhatsApp</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    // Inițializare galerie
    var thumbs = new Swiper(".thumbs", { spaceBetween: 10, slidesPerView: 4, freeMode: true, watchSlidesProgress: true });
    var main = new Swiper(".main-slider", { spaceBetween: 10, mousewheel: true, thumbs: { swiper: thumbs } });

    // Restul codului tău original (Hamburger, Popup, Theme)
    const hamburger = document.querySelector(".hamburger");
    const navOverlay = document.querySelector(".zalmoxis-menu-overlay");
    hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        navOverlay.style.display = navOverlay.style.display === "flex" ? "none" : "flex";
        setTimeout(() => navOverlay.classList.toggle("active"), 10);
    });

    const openOrderBtn = document.getElementById("openOrderPopup");
    const orderPopup = document.getElementById("orderPopup");
    openOrderBtn.addEventListener("click", () => orderPopup.classList.add("active"));
    document.getElementById("closeOrderPopup").addEventListener("click", () => orderPopup.classList.remove("active"));
    
    // Theme logic
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
        document.documentElement.classList.toggle("dark-mode");
    });
</script>

</body>
</html>
