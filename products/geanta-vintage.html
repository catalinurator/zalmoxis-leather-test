<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geanta | Zalmoxis Leather</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* CSS Integrat pentru a evita conflictele */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3e7db; color: #2a1c16; transition: background 0.3s; }
        html.dark-mode { background: #121212; color: #e0e0e0; }
        
        /* Popup Overlay - Z-INDEX FOARTE MARE PENTRU A FI DEASUPRA TUTUROR */
        .zalmoxis-popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 99999; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .zalmoxis-popup-overlay.active { display: flex; opacity: 1; }
        .zalmoxis-popup-content { background: #f3e7db; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; position: relative; }
        html.dark-mode .zalmoxis-popup-content { background: #1a1a1a; }
        
        /* Restul stilurilor rămân neschimbate pentru design-ul tău */
        .main-header { position: fixed; top: 0; width: 100%; z-index: 10000; background: #f3e7db; padding: 12px 20px; }
        .container { max-width: 1100px; margin: 100px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 20px; }
        .thumbnails img { width: 80px; height: 80px; cursor: pointer; border: 2px solid transparent; }
        .thumbnails img.active { border-color: #9A6A3A; }
    </style>
</head>
<body>

<header class="main-header">
    <a href="../index.html" class="logo">ZALMOXIS</a>
</header>

<div class="container">
    <div class="image-gallery">
        <div class="main-image-container">
            <img id="mainDisplay" src="../image/geanta1.jpg" alt="Geantă" style="width:100%">
        </div>
        <div class="thumbnails">
            <img src="../image/geanta1.jpg" class="active" onclick="changeImage(this)">
            <img src="../image/portmoneu1.jpg" onclick="changeImage(this)">
        </div>
    </div>
    <div>
        <h1>Geanta</h1>
        <button class="btn-main" id="openOrderPopup">Comandă Rapidă</button>
        <button class="btn-main" id="openChatPopup">Discută pe Chat</button>
    </div>
</div>

<div id="orderPopup" class="zalmoxis-popup-overlay">
    <div class="zalmoxis-popup-content">
        <button onclick="togglePopup('orderPopup', false)">X</button>
        <h3>Comandă Rapidă</h3>
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="bd32b38b-4a9d-431e-97cd-dc32eb24b2a4">
            <input type="text" name="Nume" required placeholder="Nume" style="width:100%">
            <input type="tel" name="Telefon" required placeholder="Telefon" style="width:100%">
            <button type="submit">Confirmă</button>
        </form>
    </div>
</div>

<div id="socialPopup" class="zalmoxis-popup-overlay">
    <div class="zalmoxis-popup-content">
        <button onclick="togglePopup('socialPopup', false)">X</button>
        <h3>WhatsApp</h3>
        <a href="https://wa.me/37369639506">Deschide WhatsApp</a>
    </div>
</div>

<script>
    // Logica pentru Popup-uri
    function togglePopup(id, show) {
        const el = document.getElementById(id);
        if (show) {
            el.classList.add('active');
        } else {
            el.classList.remove('active');
        }
    }

    document.getElementById("openOrderPopup").addEventListener("click", () => togglePopup("orderPopup", true));
    document.getElementById("openChatPopup").addEventListener("click", () => togglePopup("socialPopup", true));

    // Galerie
    function changeImage(el) {
        document.getElementById('mainDisplay').src = el.src;
        document.querySelectorAll('.thumbnails img').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
</html>
