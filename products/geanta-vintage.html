<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geanta | Zalmoxis Leather</title>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'enabled' || (savedTheme === null && prefersDark)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>

    <link rel="stylesheet" href="../style.css">

    <style>
        .hamburger, .zalmoxis-links-container a, .btn-main, .close-popup-btn { touch-action: manipulation; }

        /* NOUL COD PENTRU SLIDER ȘI ZOOM */
        .image-gallery { width: 100%; position: relative; }
        .slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; border-radius: 16px; scrollbar-width: none; }
        .slider::-webkit-scrollbar { display: none; }
        .slider img { width: 100%; flex: 0 0 100%; scroll-snap-align: center; cursor: zoom-in; border-radius: 16px; }
        
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 30000; cursor: zoom-out; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        /* -------------------------------- */

        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3e7db; color: #2a1c16; transition: background 0.3s, color 0.3s; }
        .btn-main, .channel-link, .hamburger, .theme-toggle-inline, .zalmoxis-links-container a { -webkit-tap-highlight-color: transparent; cursor: pointer; }
        html.dark-mode body { background: #121212; color: #e0e0e0; }
        html.dark-mode .price { color: #c49a6c; }
        html.dark-mode .desc { color: #b0a095; }
        html.dark-mode .btn { border-color: #c49a6c; color: #e0e0e0; }
        html.dark-mode .btn:hover { background: #c49a6c; color: #121212; }
        .container { max-width: 1100px; margin: 0 auto; margin-top: 100px !important; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px 20px; align-items: center; }
        .image-box img { width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: 0.3s; }
        .image-box img:hover { transform: scale(1.02); }
        h1 { font-size: 34px; margin: 0; }
        .price { font-size: 22px; font-weight: 600; margin: 10px 0; }
        .desc { color: #5a3a2e; line-height: 1.5; }
        .main-header { background: #f3e7db; position: fixed; top: 0; left: 0; width: 100%; z-index: 10000; border-bottom: 1px solid rgba(42, 28, 22, 0.08); transition: background 0.3s, border-color 0.3s; }
        html.dark-mode .main-header { background: #121212; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .header-container { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: 700; text-decoration: none; color: #2a1c16; letter-spacing: 3px; transition: color 0.3s; position: relative; z-index: 10003; }
        html.dark-mode .logo { color: #e0e0e0; }
        .hamburger { display: block; cursor: pointer; background: transparent; border: none; padding: 6px; z-index: 10003 !important; position: relative; }
        .bar { display: block; width: 24px; height: 1.5px; margin: 5px auto; transition: all 0.3s ease-in-out; background-color: #2a1c16; }
        html.dark-mode .bar { background-color: #e0e0e0; }
        .hamburger.active .bar:nth-child(2) { opacity: 0; }
        .hamburger.active .bar:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
        .hamburger.active .bar:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
        .zalmoxis-menu-overlay { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100vh !important; background-color: #f3e7db !important; z-index: 10001 !important; display: none !important; opacity: 0 !important; transform: translateY(-20px) !important; transition: opacity 0.3s ease, transform 0.3s ease !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; }
        html.dark-mode .zalmoxis-menu-overlay { background-color: #121212 !important; }
        .zalmoxis-menu-overlay.active { display: flex !important; opacity: 1 !important; transform: translateY(0) !important; }
        .zalmoxis-links-container { display: flex !important; flex-direction: column !important; align-items: center !important; gap: 30px !important; width: 100% !important; }
        .zalmoxis-links-container a { text-decoration: none !important; color: #2a1c16 !important; font-size: 26px !important; font-weight: 500 !important; letter-spacing: 1px !important; transition: color 0.3s !important; display: block !important; text-align: center !important; }
        html.dark-mode .zalmoxis-links-container a { color: #e0e0e0 !important; }
        .zalmoxis-links-container a:hover { color: #9A6A3A !important; }
        .menu-spacer { height: 10px; }
        .theme-toggle-inline { background: transparent !important; border: 1px solid rgba(154, 106, 58, 0.4) !important; padding: 12px 24px !important; border-radius: 25px !important; color: #5a3a2e !important; cursor: pointer !important; display: flex !important; align-items: center !important; justify-content: center !important; gap: 10px !important; font-family: inherit !important; font-size: 15px !important; transition: all 0.3s !important; }
        html.dark-mode .theme-toggle-inline { border-color: rgba(196, 154, 108, 0.4) !important; color: #b0a095 !important; }
        .action-buttons-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .btn-main { display: inline-block; padding: 14px 20px; border: 1px solid #9A6A3A; background: transparent; color: #2A211B; text-decoration: none; font-family: inherit; font-size: 15px; font-weight: 600; text-align: center; cursor: pointer; transition: .3s ease; position: relative; z-index: 10; }
        .btn-buy { background: #9A6A3A; color: white; }
        .btn-buy:hover { background: transparent; color: #9A6A3A; transform: translateY(-2px); }
        .btn-chat:hover { background: #9A6A3A; color: white; transform: translateY(-2px); }
        html.dark-mode .btn-main { border-color: #c49a6c; color: #e0e0e0; }
        html.dark-mode .btn-buy { background: #c49a6c; color: #121212; }
        html.dark-mode .btn-buy:hover { background: transparent; color: #c49a6c; }
        html.dark-mode .btn-chat:hover { background: #c49a6c; color: #121212; }
        .zalmoxis-popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); z-index: 20000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .zalmoxis-popup-overlay.active { display: flex; }
        .zalmoxis-popup-content { background: #f3e7db; padding: 35px 25px; border-radius: 16px; max-width: 420px; width: 90%; text-align: center; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.2); transform: scale(0.9); transition: transform 0.3s ease; max-height: 90vh; overflow-y: auto; }
        .zalmoxis-popup-overlay.active .zalmoxis-popup-content { transform: scale(1); }
        html.dark-mode .zalmoxis-popup-content { background: #1a1a1a; color: #e0e0e0; }
        .close-popup-btn { position: absolute; top: 15px; right: 15px; background: transparent; border: none; font-size: 28px; cursor: pointer; color: #2a1c16; line-height: 1; }
        html.dark-mode .close-popup-btn { color: #e0e0e0; }
        .zalmoxis-popup-content h3 { margin: 0 0 10px 0; font-size: 22px; font-weight: 700; }
        .zalmoxis-popup-content p { font-size: 14px; margin-bottom: 25px; opacity: 0.8; line-height: 1.4; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; opacity: 0.9; }
        .form-input { width: 100%; padding: 11px; border: 1px solid rgba(154, 106, 58, 0.5); background: transparent; color: inherit; font-family: inherit; font-size: 14px; box-sizing: border-box; border-radius: 6px; }
        .form-input:focus { outline: none; border-color: #9A6A3A; }
        html.dark-mode .form-input { border-color: rgba(196, 154, 108, 0.4); }
        html.dark-mode .form-input:focus { border-color: #c49a6c; }
        .btn-submit { width: 100%; background: #9A6A3A; color: white; border: none; padding: 14px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border-radius: 6px; margin-top: 10px; transition: background 0.3s; }
        .btn-submit:hover { background: #7d542d; }
        html.dark-mode .btn-submit { background: #c49a6c; color: #121212; }
        html.dark-mode .btn-submit:hover { background: #b08759; }
        .social-channels-grid { display: flex; flex-direction: column; gap: 12px; }
        .channel-link { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; text-decoration: none; color: white !important; font-weight: 600; font-size: 15px; border-radius: 8px; transition: transform 0.2s, filter 0.2s; }
        .channel-link:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .channel-link svg { width: 20px; height: 20px; fill: currentColor; }
        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .tiktok { background: #000000; border: 1px solid rgba(37, 244, 238, 0.5); }
        .whatsapp { background: #25D366; }
        .telegram { background: #24A1DE; }
        @media(max-width:768px){ .container { grid-template-columns: 1fr; text-align: center; margin-top: 70px !important; padding-top: 20px; } .zalmoxis-links-container a { font-size: 24px !important; } .action-buttons-group { grid-template-columns: 1fr; gap: 10px; } }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <a href="../index.html" class="logo">ZALMOXIS</a>
        <button class="hamburger" aria-label="Deschide meniul">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>
</header>

<div class="zalmoxis-menu-overlay">
    <nav class="zalmoxis-links-container">
        <a href="../index.html">Acasă</a>
        <a href="../index.html#produse">Produse</a>
        <a href="../index.html#despre">Despre Noi</a>
        <a href="../index.html#contact">Contact</a>
        <div class="menu-spacer"></div>
        <button id="themeToggleBtn" class="theme-toggle-inline" aria-label="Schimbă tema">
            <span class="theme-text">Mod Întunecat</span>
            <span class="theme-icons">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display:none; width:18px; height:18px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.344l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" /></svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:18px; height:18px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
            </span>
        </button>
    </nav>
</div>

<div class="container">
    <div class="image-gallery">
        <div class="slider">
            <img src="../image/geanta1.jpg" alt="Geantă 1" class="zoomable">
            <img src="../image/geanta2.jpg" alt="Geantă 2" class="zoomable">
            <img src="../image/geanta3.jpg" alt="Geantă 3" class="zoomable">
        </div>
    </div>

    <div>
        <h1>Geanta</h1>
        <div class="price">test 4 </div>
        <div class="desc">Geanta din piele naturală, lucrată manual pentru rezistență.</div>
        <div class="action-buttons-group">
            <button class="btn-main btn-buy" id="openOrderPopup">Comandă Rapidă</button>
            <button class="btn-main btn-chat" id="openChatPopup">Discută pe Chat</button>
        </div>
    </div>
</div>

<div id="lightbox" class="lightbox"><img src="" id="lightboxImg" alt="Zoom"></div>

<div id="orderPopup" class="zalmoxis-popup-overlay">
    <div class="zalmoxis-popup-content">
        <button class="close-popup-btn" id="closeOrderPopup">&times;</button>
        <h3>Comandă Rapidă</h3>
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="bd32b38b-4a9d-431e-97cd-dc32eb24b2a4">
            <div class="form-group"><label>Nume:</label><input type="text" name="Nume" class="form-input" required></div>
            <div class="form-group"><label>Telefon:</label><input type="tel" name="Telefon" class="form-input" required></div>
            <button type="submit" class="btn-submit">Confirmă</button>
        </form>
    </div>
</div>

<div id="socialPopup" class="zalmoxis-popup-overlay">
    <div class="zalmoxis-popup-content">
        <button class="close-popup-btn" id="closeChatPopup">&times;</button>
        <h3>Discută cu noi</h3>
        <div class="social-channels-grid">
            <a href="https://wa.me/37369639506" class="channel-link whatsapp">WhatsApp</a>
        </div>
    </div>
</div>

<script>
    // Slider & Zoom Logic
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    document.querySelectorAll('.zoomable').forEach(img => {
        img.addEventListener('click', () => {
            lightboxImg.src = img.src;
            lightbox.classList.add('active');
            document.body.style.overflow = "hidden";
        });
    });
    lightbox.addEventListener('click', () => {
        lightbox.classList.remove('active');
        document.body.style.overflow = "auto";
    });

    // Meniu & Restul Logicii
    const hamburger = document.querySelector(".hamburger");
    const navOverlay = document.querySelector(".zalmoxis-menu-overlay");
    hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        navOverlay.style.display = (navOverlay.style.display === "flex") ? "none" : "flex";
        setTimeout(() => navOverlay.classList.toggle("active"), 10);
        document.body.style.overflow = (navOverlay.classList.contains("active")) ? "auto" : "hidden";
    });

    const btn = document.getElementById('themeToggleBtn');
    function updateIcons(isDark) {
        btn.querySelector('.sun-icon').style.display = isDark ? 'block' : 'none';
        btn.querySelector('.moon-icon').style.display = isDark ? 'none' : 'block';
        btn.querySelector('.theme-text').textContent = isDark ? 'Mod Luminos' : 'Mod Întunecat';
    }
    function setTheme(isDark) {
        document.documentElement.classList.toggle('dark-mode', isDark);
        updateIcons(isDark);
    }
    btn.addEventListener('click', () => {
        const isDark = !document.documentElement.classList.contains('dark-mode');
        setTheme(isDark);
        localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
    });
    initTheme(); function initTheme() { updateIcons(document.documentElement.classList.contains('dark-mode')); }

    const openOrderBtn = document.getElementById("openOrderPopup");
    const closeOrderBtn = document.getElementById("closeOrderPopup");
    const orderPopup = document.getElementById("orderPopup");
    openOrderBtn.addEventListener("click", () => { orderPopup.style.display = "flex"; setTimeout(() => orderPopup.classList.add("active"), 10); });
    closeOrderBtn.addEventListener("click", () => { orderPopup.classList.remove("active"); setTimeout(() => orderPopup.style.display = "none", 300); });
    
    const openChatBtn = document.getElementById("openChatPopup");
    const closeChatBtn = document.getElementById("closeChatPopup");
    const socialPopup = document.getElementById("socialPopup");
    openChatBtn.addEventListener("click", () => { socialPopup.style.display = "flex"; setTimeout(() => socialPopup.classList.add("active"), 10); });
    closeChatBtn.addEventListener("click", () => { socialPopup.classList.remove("active"); setTimeout(() => socialPopup.style.display = "none", 300); });
</script>

</body>
</html>
