<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geanta | Zalmoxis Leather</title>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('darkMode');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'enabled' || (savedTheme === null && prefersDark)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>

    <link rel="stylesheet" href="../style.css">

    <style>
        /* RESET & BAZĂ */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3e7db; color: #2a1c16; transition: background 0.3s, color 0.3s; }
        html.dark-mode body { background: #121212; color: #e0e0e0; }
        
        .btn-main, .channel-link, .hamburger, .theme-toggle-inline, .zalmoxis-links-container a, .close-popup-btn { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        /* HEADER & NAVIGAȚIE */
        .main-header { background: #f3e7db; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(42, 28, 22, 0.08); transition: 0.3s; }
        html.dark-mode .main-header { background: #121212; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .header-container { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: 700; text-decoration: none; color: #2a1c16; letter-spacing: 3px; z-index: 10003; transition: 0.3s; }
        html.dark-mode .logo { color: #e0e0e0; }

        .hamburger { background: transparent; border: none; padding: 6px; z-index: 10003; }
        .bar { display: block; width: 24px; height: 1.5px; margin: 5px auto; transition: 0.3s; background-color: #2a1c16; }
        html.dark-mode .bar { background-color: #e0e0e0; }
        .hamburger.active .bar:nth-child(2) { opacity: 0; }
        .hamburger.active .bar:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
        .hamburger.active .bar:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

        .zalmoxis-menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #f3e7db; z-index: 10001; display: none; opacity: 0; transform: translateY(-20px); transition: 0.3s; flex-direction: column; align-items: center; justify-content: center; }
        html.dark-mode .zalmoxis-menu-overlay { background: #121212; }
        .zalmoxis-menu-overlay.active { display: flex !important; opacity: 1; transform: translateY(0); }
        .zalmoxis-links-container { display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .zalmoxis-links-container a { text-decoration: none; color: #2a1c16; font-size: 26px; font-weight: 500; transition: 0.3s; }
        html.dark-mode .zalmoxis-links-container a { color: #e0e0e0; }
        .zalmoxis-links-container a:hover { color: #9A6A3A; }

        /* CONȚINUT PAGINĂ */
        .container { max-width: 1100px; margin: 100px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px 20px; align-items: center; }
        .image-box img { width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: 0.3s; }
        .image-box img:hover { transform: scale(1.02); }
        h1 { font-size: 34px; margin: 0; }
        .price { font-size: 22px; font-weight: 600; margin: 10px 0; }
        html.dark-mode .price { color: #c49a6c; }
        .desc { color: #5a3a2e; line-height: 1.5; }
        html.dark-mode .desc { color: #b0a095; }

        /* BUTOANE */
        .action-buttons-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .btn-main { padding: 14px 20px; border: 1px solid #9A6A3A; background: transparent; color: #2A211B; font-weight: 600; transition: .3s; text-align: center; text-decoration: none; border-radius: 4px; }
        .btn-buy { background: #9A6A3A; color: white; }
        .btn-buy:hover { background: transparent; color: #9A6A3A; transform: translateY(-2px); }
        .btn-chat:hover { background: #9A6A3A; color: white; transform: translateY(-2px); }
        html.dark-mode .btn-main { border-color: #c49a6c; color: #e0e0e0; }
        html.dark-mode .btn-buy { background: #c49a6c; color: #121212; }

        /* POP-UP */
        .zalmoxis-popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 20000; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; }
        .zalmoxis-popup-overlay.active { display: flex !important; opacity: 1; }
        .zalmoxis-popup-content { background: #f3e7db; padding: 35px 25px; border-radius: 16px; width: 90%; max-width: 420px; text-align: center; position: relative; }
        html.dark-mode .zalmoxis-popup-content { background: #1a1a1a; color: #e0e0e0; }
        .close-popup-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 28px; }
        
        .form-input { width: 100%; padding: 11px; border: 1px solid rgba(154, 106, 58, 0.5); background: transparent; color: inherit; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; }
        .btn-submit { width: 100%; background: #9A6A3A; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        html.dark-mode .btn-submit { background: #c49a6c; color: #121212; }

        /* SOCIAL */
        .channel-link { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; color: white !important; border-radius: 8px; text-decoration: none; margin-bottom: 10px; transition: 0.2s; }
        .channel-link:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .instagram { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
        .tiktok { background: #000; border: 1px solid rgba(37, 244, 238, 0.5); }
        .whatsapp { background: #25D366; }
        .telegram { background: #24A1DE; }

        @media(max-width:768px){ .container { grid-template-columns: 1fr; margin-top: 70px !important; } }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <a href="../index.html" class="logo">ZALMOXIS</a>
        <button class="hamburger" aria-label="Deschide meniul">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>
    </div>
</header>

<div class="zalmoxis-menu-overlay">
    <nav class="zalmoxis-links-container">
        <a href="../index.html">Acasă</a>
        <a href="../index.html#produse">Produse</a>
        <a href="../index.html#despre">Despre Noi</a>
        <a href="../index.html#contact">Contact</a>
        <button id="themeToggleBtn" class="theme-toggle-inline" style="background:transparent; border:1px solid #9A6A3A; padding:10px 20px; border-radius:20px; color:inherit;">
            <span class="theme-text">Mod Întunecat</span>
        </button>
    </nav>
</div>

<main class="container">
    <div class="image-box">
        <img id="productImg" src="../image/geanta1.jpg" alt="Geanta din piele naturală">
    </div>
    <div>
        <h1>Geanta</h1>
        <div class="price">TEST 2</div>
        <div class="desc">Geanta din piele naturală, lucrată manual pentru rezistență.</div>
        <div class="action-buttons-group">
            <button class="btn-main btn-buy" id="openOrderPopup">Comandă Rapidă</button>
            <button class="btn-main btn-chat" id="openChatPopup">Discută pe Chat</button>
        </div>
    </div>
</main>

<div id="orderPopup" class="zalmoxis-popup-overlay">
    <div class="zalmoxis-popup-content">
        <button class="close-popup-btn" id="closeOrderPopup">&times;</button>
        <h3>Comandă Rapidă</h3>
        <p>Lasă-ne datele tale și te sunăm noi în cel mai scurt timp.</p>
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="bd32b38b-4a9d-431e-97cd-dc32eb24b2a4">
            <input type="hidden" name="subject" value="Comandă Nouă - Geantă Piele">
            <input type="text" name="Nume Client" class="form-input" placeholder="Nume și Prenume" required>
            <input type="tel" name="Telefon" class="form-input" placeholder="Număr de Telefon" required>
            <textarea name="Note" class="form-input" rows="2" placeholder="Detalii (opțional)"></textarea>
            <button type="submit" class="btn-submit">Confirmă Comanda</button>
        </form>
    </div>
</div>

<div id="socialPopup" class="zalmoxis-popup-overlay">
    <div class="zalmoxis-popup-content">
        <button class="close-popup-btn" id="closeChatPopup">&times;</button>
        <h3>Unde doriți să discutăm?</h3>
        <div class="social-channels-grid">
            <a href="https://www.instagram.com/zalmoxis_leather/" target="_blank" class="channel-link instagram">Instagram</a>
            <a href="https://www.tiktok.com/@zalmoxis.leather" target="_blank" class="channel-link tiktok">TikTok</a>
            <a href="https://wa.me/37369639506" target="_blank" class="channel-link whatsapp">WhatsApp</a>
            <a href="https://t.me/Felicia0708" target="_blank" class="channel-link telegram">Telegram</a>
        </div>
    </div>
</div>

<script>
    // Logică Meniu
    const hamburger = document.querySelector(".hamburger");
    const navOverlay = document.querySelector(".zalmoxis-menu-overlay");
    const toggleMenu = () => {
        const isOpen = navOverlay.classList.toggle("active");
        hamburger.classList.toggle("active");
        navOverlay.style.display = isOpen ? "flex" : "none";
        document.body.style.overflow = isOpen ? "hidden" : "auto";
    };
    hamburger.addEventListener("click", toggleMenu);

    // Logică Pop-up
    const setupModal = (btnId, modalId, closeId) => {
        const btn = document.getElementById(btnId);
        const modal = document.getElementById(modalId);
        const close = document.getElementById(closeId);
        btn.onclick = () => { modal.classList.add("active"); modal.style.display = "flex"; };
        close.onclick = () => { modal.classList.remove("active"); setTimeout(() => modal.style.display = "none", 300); };
    };
    setupModal("openOrderPopup", "orderPopup", "closeOrderPopup");
    setupModal("openChatPopup", "socialPopup", "closeChatPopup");

    // Logică Dark Mode
    const themeBtn = document.getElementById('themeToggleBtn');
    themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        themeBtn.querySelector('.theme-text').textContent = isDark ? 'Mod Luminos' : 'Mod Întunecat';
    });
</script>
</body>
</html>
