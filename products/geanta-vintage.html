<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geanta | Zalmoxis Leather</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f3e7db;
            color: #2a1c16;
            transition: background 0.3s, color 0.3s;
        }

        .btn-main, .channel-link, .hamburger, .theme-toggle-inline, .zalmoxis-links-container a {
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }

        html.dark-mode body { background: #121212; color: #e0e0e0; }
        html.dark-mode .price { color: #c49a6c; }
        html.dark-mode .desc { color: #b0a095; }
        html.dark-mode .btn { border-color: #c49a6c; color: #e0e0e0; }
        html.dark-mode .btn:hover { background: #c49a6c; color: #121212; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            margin-top: 100px !important;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px 20px;
            align-items: center;
        }

        .image-box img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: 0.3s;
        }
        .image-box img:hover { transform: scale(1.02); }

        h1 { font-size: 34px; margin: 0; }
        .price { font-size: 22px; font-weight: 600; margin: 10px 0; }
        .desc { color: #5a3a2e; line-height: 1.5; }

        .main-header {
            background: #f3e7db; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            border-bottom: 1px solid rgba(42, 28, 22, 0.08); 
            transition: background 0.3s, border-color 0.3s;
        }
        html.dark-mode .main-header { background: #121212; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }

        .header-container { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: 700; text-decoration: none; color: #2a1c16; letter-spacing: 3px; z-index: 10003; }
        html.dark-mode .logo { color: #e0e0e0; }

        .hamburger { display: block; cursor: pointer; background: transparent; border: none; padding: 6px; z-index: 10003; position: relative; }
        .bar { display: block; width: 24px; height: 1.5px; margin: 5px auto; transition: all 0.3s ease-in-out; background-color: #2a1c16; }
        html.dark-mode .bar { background-color: #e0e0e0; }
        .hamburger.active .bar:nth-child(2) { opacity: 0; }
        .hamburger.active .bar:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
        .hamburger.active .bar:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

        .zalmoxis-menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: #f3e7db; z-index: 10001;
            display: none; opacity: 0; transform: translateY(-20px); transition: opacity 0.3s ease, transform 0.3s ease;
            flex-direction: column; align-items: center; justify-content: center;
        }
        html.dark-mode .zalmoxis-menu-overlay { background-color: #121212; }
        .zalmoxis-menu-overlay.active { display: flex !important; opacity: 1; transform: translateY(0); }

        .zalmoxis-links-container { display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
        .zalmoxis-links-container a { text-decoration: none; color: #2a1c16; font-size: 26px; font-weight: 500; }
        html.dark-mode .zalmoxis-links-container a { color: #e0e0e0; }

        .zalmoxis-popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px); z-index: 20000; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none; /* REZOLVARE MOBIL: blocare atingeri fantomă */
        }
        .zalmoxis-popup-overlay.active { display: flex; opacity: 1; pointer-events: auto; }

        .zalmoxis-popup-content {
            background: #f3e7db; padding: 35px 25px; border-radius: 16px; max-width: 420px; width: 90%; text-align: center;
            position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.2); transform: scale(0.9); transition: transform 0.3s ease;
        }
        .zalmoxis-popup-overlay.active .zalmoxis-popup-content { transform: scale(1); }
        html.dark-mode .zalmoxis-popup-content { background: #1a1a1a; color: #e0e0e0; }

        .close-popup-btn { position: absolute; top: 15px; right: 15px; background: transparent; border: none; font-size: 28px; cursor: pointer; color: #2a1c16; }
        html.dark-mode .close-popup-btn { color: #e0e0e0; }

        .form-input { width: 100%; padding: 11px; border: 1px solid rgba(154, 106, 58, 0.5); background: transparent; color: inherit; border-radius: 6px; }
        .btn-submit { width: 100%; background: #9A6A3A; color: white; border: none; padding: 14px; cursor: pointer; border-radius: 6px; margin-top: 10px; }
        
        .channel-link {
            display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px;
            text-decoration: none; color: white !important; font-weight: 600; border-radius: 8px; z-index: 20005;
        }
        .social-channels-grid { display: flex; flex-direction: column; gap: 12px; }
        .instagram { background: #E1306C; }
        .tiktok { background: #000000; }
        .whatsapp { background: #25D366; }
        .telegram { background: #24A1DE; }

        .action-buttons-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .btn-main { padding: 14px 20px; border: 1px solid #9A6A3A; background: transparent; color: #2A211B; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-buy { background: #9A6A3A; color: white; }

        @media(max-width:768px){
            .container { grid-template-columns: 1fr; text-align: center; margin-top: 70px !important; }
        }
    </style>
</head>

<body>
    <header class="main-header">
        <div class="header-container">
            <a href="../index.html" class="logo">ZALMOXIS</a>
            <button class="hamburger" aria-label="Deschide meniul">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </button>
        </div>
    </header>

    <div class="zalmoxis-menu-overlay">
        <nav class="zalmoxis-links-container">
            <a href="../index.html">Acasă</a>
            <a href="../index.html#produse">Produse</a>
            <a href="../index.html#despre">Despre Noi</a>
            <a href="../index.html#contact">Contact</a>
            <button id="themeToggleBtn" class="theme-toggle-inline">Schimbă tema</button>
        </nav>
    </div>

    <div class="container">
        <div class="image-box"><img src="../image/geanta1.jpg" alt="Geanta"></div>
        <div>
            <h1>Geanta</h1>
            <div class="price">1899 MDL</div>
            <div class="action-buttons-group">
                <button class="btn-main btn-buy" id="openOrderPopup">Comandă Rapidă</button>
                <button class="btn-main btn-chat" id="openChatPopup">Discută pe Chat</button>
            </div>
        </div>
    </div>

    <div id="orderPopup" class="zalmoxis-popup-overlay">
        <div class="zalmoxis-popup-content">
            <button class="close-popup-btn" id="closeOrderPopup">&times;</button>
            <h3>Comandă</h3>
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="bd32b38b-4a9d-431e-97cd-dc32eb24b2a4">
                <input type="text" name="Nume" class="form-input" placeholder="Nume" required>
                <input type="tel" name="Telefon" class="form-input" placeholder="Telefon" required>
                <button type="submit" class="btn-submit">Trimite</button>
            </form>
        </div>
    </div>

    <div id="socialPopup" class="zalmoxis-popup-overlay">
        <div class="zalmoxis-popup-content">
            <button class="close-popup-btn" id="closeChatPopup">&times;</button>
            <div class="social-channels-grid">
                <a href="https://www.instagram.com/zalmoxis_leather/" target="_blank" class="channel-link instagram">Instagram</a>
                <a href="https://wa.me/37369639506" target="_blank" class="channel-link whatsapp">WhatsApp</a>
            </div>
        </div>
    </div>

    <script>
        // Logica simplificată pentru modale
        const openOrderBtn = document.getElementById("openOrderPopup");
        const orderPopup = document.getElementById("orderPopup");
        const openChatBtn = document.getElementById("openChatPopup");
        const socialPopup = document.getElementById("socialPopup");

        openOrderBtn.onclick = () => orderPopup.classList.add("active");
        document.getElementById("closeOrderPopup").onclick = () => orderPopup.classList.remove("active");
        
        openChatBtn.onclick = () => socialPopup.classList.add("active");
        document.getElementById("closeChatPopup").onclick = () => socialPopup.classList.remove("active");
    </script>
</body>
</html>
