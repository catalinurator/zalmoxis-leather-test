<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geanta | Zalmoxis Leather</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f3e7db;
            color: #2a1c16;
            transition: background 0.3s, color 0.3s;
        }

        /* --- REGULI PENTRU DARK MODE --- */
        html.dark-mode body {
            background: #121212;
            color: #e0e0e0;
        }

        html.dark-mode .price {
            color: #c49a6c;
        }

        html.dark-mode .desc {
            color: #b0a095;
        }

        html.dark-mode .btn {
            border-color: #c49a6c;
            color: #e0e0e0;
        }

        html.dark-mode .btn:hover {
            background: #c49a6c;
            color: #121212;
        }
        /* -------------------------------- */

        .container {
            max-width: 1100px;
            margin: 0 auto;
            margin-top: 100px !important;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px 20px;
            align-items: center;
        }

        /* IMAGE */
        .image-box img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .image-box img:hover {
            transform: scale(1.02);
        }

        /* TEXT */
        h1 {
            font-size: 34px;
            margin: 0;
        }

        .price {
            font-size: 22px;
            font-weight: 600;
            margin: 10px 0;
        }

        .desc {
            color: #5a3a2e;
            line-height: 1.5;
        }

        html.dark-mode .desc {
            color: #b0a095;
        }

        /* --- HEADER FIXED --- */
        .main-header {
            background: #f3e7db; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            border-bottom: 1px solid rgba(42, 28, 22, 0.08); 
            transition: background 0.3s, border-color 0.3s;
        }

        html.dark-mode .main-header {
            background: #121212; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            color: #2a1c16; 
            letter-spacing: 3px;
            transition: color 0.3s;
            position: relative;
            z-index: 10003;
        }
        html.dark-mode .logo { color: #e0e0e0; }

        /* HAMBURGER */
        .hamburger {
            display: block;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 6px;
            z-index: 10003 !important;
            position: relative;
        }

        .bar {
            display: block;
            width: 24px;
            height: 1.5px;
            margin: 5px auto;
            transition: all 0.3s ease-in-out;
            background-color: #2a1c16;
        }
        html.dark-mode .bar { background-color: #e0e0e0; }

        .hamburger.active .bar:nth-child(2) { opacity: 0; }
        .hamburger.active .bar:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
        .hamburger.active .bar:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

        /* --- OVERLAY MENIU HAMBURGER --- */
        .zalmoxis-menu-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100vh !important;
            background-color: #f3e7db !important;
            z-index: 10001 !important;
            display: none !important; 
            opacity: 0 !important;
            transform: translateY(-20px) !important;
            transition: opacity 0.3s ease, transform 0.3s ease !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
        }

        html.dark-mode .zalmoxis-menu-overlay {
            background-color: #121212 !important;
        }

        .zalmoxis-menu-overlay.active {
            display: flex !important;
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .zalmoxis-links-container {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 30px !important;
            width: 100% !important;
        }

        .zalmoxis-links-container a {
            text-decoration: none !important;
            color: #2a1c16 !important;
            font-size: 26px !important;
            font-weight: 500 !important;
            letter-spacing: 1px !important;
            transition: color 0.3s !important;
            display: block !important;
            text-align: center !important;
        }
        html.dark-mode .zalmoxis-links-container a { color: #e0e0e0 !important; }
        .zalmoxis-links-container a:hover { color: #9A6A3A !important; }

        .menu-spacer {
            height: 10px;
        }

        .theme-toggle-inline {
            background: transparent !important;
            border: 1px solid rgba(154, 106, 58, 0.4) !important;
            padding: 12px 24px !important;
            border-radius: 25px !important;
            color: #5a3a2e !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
            font-family: inherit !important;
            font-size: 15px !important;
