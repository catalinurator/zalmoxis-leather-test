backend:
  name: git-gateway
  branch: main

media_folder: "/image"
public_folder: "image"

locale: "ro"

collections:
  - name: "products"
    label: "Produse"
    folder: "products-data"
    extension: "json"
    format: "json"
    create: false
    identifier_field: "title"
    fields:
      - { label: "Titlu produs (RO)", name: "title", widget: "string", required: false, hint: "Folosit pentru: Portmoneu Auto, Portofel minimalist, Curea clasica" }
      - { label: "Titlu produs (RO) — doar pentru Geantă Vintage", name: "title_ro", widget: "string", required: false }
      - { label: "Titlu produs (EN) — doar pentru Geantă Vintage", name: "title_en", widget: "string", required: false }
      - { label: "Preț", name: "price", widget: "string", hint: "Exemplu: 389 MDL" }
      - { label: "Descriere (RO)", name: "description", widget: "text", required: false, hint: "Folosit pentru: Portmoneu Auto, Portofel minimalist, Curea clasica" }
      - { label: "Descriere (RO) — doar pentru Geantă Vintage", name: "description_ro", widget: "text", required: false }
      - { label: "Descriere (EN) — doar pentru Geantă Vintage", name: "description_en", widget: "text", required: false }
      - { label: "Imagine principală", name: "mainImage", widget: "image", required: false }
      - label: "Culori disponibile"
        name: "colors"
        widget: "list"
        required: false
        fields:
          - { label: "Nume culoare", name: "name", widget: "string" }
          - { label: "Imagine pentru această culoare", name: "image", widget: "image" }

  - name: "categories"
    label: "Pagini de categorie"
    folder: "category-data"
    extension: "json"
    format: "json"
    create: false
    identifier_field: "pageTitle"
    fields:
      - { label: "Titlu pagină", name: "pageTitle", widget: "string" }
      - { label: "Text introductiv", name: "pageIntro", widget: "text" }
      - { label: "Text buton (ex: Comandă un model personalizat)", name: "ctaText", widget: "string" }
      - label: "Produse afișate pe această pagină"
        name: "items"
        widget: "list"
        fields:
          - { label: "Titlu produs", name: "title", widget: "string" }
          - { label: "Preț", name: "price", widget: "string" }
          - { label: "Descriere scurtă", name: "description", widget: "text" }
          - { label: "Imagine", name: "image", widget: "image" }
          - { label: "Link către pagina produsului", name: "link", widget: "string", hint: "Exemplu: products/curea-classic.html" }
