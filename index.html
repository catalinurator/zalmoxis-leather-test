<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalmoxis Leather | Piele Naturală & Lucru Manual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Stilul consolidat pentru butonul de Dark Mode */
        .theme-toggle-header {
            background: transparent !important;
            border: none !important;
            cursor: pointer !important;
            padding: 8px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 40px;
            height: 40px;
            border-radius: 50% !important;
            color: #2a1c16 !important;
            transition: all 0.3s ease !important;
            z-index: 1002;
        }

        html.dark-mode .theme-toggle-header {
            color: #e0e0e0 !important;
        }

        .theme-toggle-header svg {
            position: absolute !important;
            width: 22px !important;
            height: 22px !important;
            transition: transform 0.5s ease, opacity 0.5s ease !important;
        }

        .theme-toggle-header .sun-icon { opacity: 0 !important; transform: rotate(90deg) !important; }
        .theme-toggle-header .moon-icon { opacity: 1 !important; transform: rotate(0deg) !important; }

        html.dark-mode .theme-toggle-header .sun-icon { opacity: 1 !important; transform: rotate(0deg) !important; }
        html.dark-mode .theme-toggle-header .moon-icon { opacity: 0 !important; transform: rotate(-90deg) !important; }

        /* Desktop: Poziție fixă în dreapta sus */
        @media (min-width: 769px) {
            .theme-toggle-header {
                position: absolute !important;
                top: 50% !important;
                transform: translateY(-50%) !important;
                right: 20px !important;
            }
            .theme-toggle-header:hover { background-color: rgba(154, 106, 58, 0.1) !important; }
        }

        /* Mobil: Poziție în interiorul meniului */
        @media (max-width: 768px) {
            .theme-toggle-header {
                position: relative !important;
                margin: 20px auto 0 auto !important;
                padding: 12px !important;
                width: 50px;
                height: 50px;
                background-color: rgba(154, 106, 58, 0.1) !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo" style="text-decoration: none !important; border: none !important;">ZALMOXIS</a>
            <button class="menu-toggle" aria-label="Deschide meniul">☰</button>
            <nav class="nav-menu">
                <a href="index.html" class="active">Acasă</a>
                <a href="#produse">Produse</a>
                <a href="#atelier">Atelier</a>
                <a href="#proces">Cum lucrăm</a>
                <a href="#contact">Contact</a>
                
                <button id="headerThemeToggle" class="theme-toggle-header" aria-label="Schimbă tema">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.344l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    ...

    <script>
        const headerThemeBtn = document.getElementById('headerThemeToggle');
        function reflectTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.documentElement.classList.remove('dark-mode');
                localStorage.setItem('darkMode', 'disabled');
            }
        }

        if (headerThemeBtn) {
            headerThemeBtn.addEventListener('click', () => {
                const isCurrentlyDark = document.documentElement.classList.contains('dark-mode');
                reflectTheme(!isCurrentlyDark);
            });
        }

        const currentSavedTheme = localStorage.getItem('darkMode');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        if (currentSavedTheme === 'enabled') reflectTheme(true);
        else if (currentSavedTheme === 'disabled') reflectTheme(false);
        else reflectTheme(systemPrefersDark.matches);
    </script>
    <script src="script.js"></script>
</body>
</html>
