<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalmoxis Leather | Piele Naturală & Lucru Manual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Butonul devine un element de navigare normal, nu mai folosim absolute */
        .theme-toggle-header {
            background: transparent !important;
            border: none !important;
            cursor: pointer !important;
            padding: 8px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 40px;
            height: 40px;
            border-radius: 50% !important;
            color: inherit !important;
            transition: all 0.3s ease !important;
            margin-left: 15px; /* Spațiu în meniu pe desktop */
        }

        .theme-toggle-header svg {
            width: 22px !important;
            height: 22px !important;
            transition: opacity 0.3s ease !important;
        }

        /* Logica de afișare iconițe */
        .sun-icon { opacity: 0; transform: rotate(90deg); transition: 0.5s; }
        .moon-icon { opacity: 1; transform: rotate(0deg); transition: 0.5s; }

        html.dark-mode .sun-icon { opacity: 1; transform: rotate(0deg); }
        html.dark-mode .moon-icon { opacity: 0; transform: rotate(-90deg); }

        /* Mobil */
        @media (max-width: 768px) {
            .theme-toggle-header {
                margin: 20px auto !important; /* Centrat în meniul mobil */
                background-color: rgba(154, 106, 58, 0.1) !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">ZALMOXIS</a>
            <button class="menu-toggle" aria-label="Deschide meniul">☰</button>
            
            <!-- Butonul este acum un membru legitim al meniului -->
            <nav class="nav-menu">
                <a href="index.html" class="active">Acasă</a>
                <a href="#produse">Produse</a>
                <a href="#atelier">Atelier</a>
                <a href="#proces">Cum lucrăm</a>
                <a href="#contact">Contact</a>
                
                <button id="headerThemeToggle" class="theme-toggle-header" aria-label="Schimbă tema">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.344l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <!-- Conținutul tău aici -->

    <script>
        const headerThemeBtn = document.getElementById('headerThemeToggle');
        
        function reflectTheme(isDark) {
            document.documentElement.classList.toggle('dark-mode', isDark);
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        }

        headerThemeBtn?.addEventListener('click', () => {
            reflectTheme(!document.documentElement.classList.contains('dark-mode'));
        });

        // Inițializare
        const savedTheme = localStorage.getItem('darkMode');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        reflectTheme(savedTheme === 'enabled' || (!savedTheme && systemDark));
    </script>
</body>
</html>
